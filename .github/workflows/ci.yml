name: Pipeline CI com Docker

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build com Docker Compose
        run: docker compose build
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}

      - name: Push com Docker Compose
        run: docker compose push
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}        

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USER }}/my-project-cicd:latest

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Subir ambiente de teste
        run: docker compose up -d
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}

      - name: Rodar testes dentro do Container (Ping)
        run: docker compose exec -T calculadora-app ping -c 1 servico-vizinho